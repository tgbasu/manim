name: Reel autopilot

# Produces the next queued reel and publishes it. Scheduled runs stay off until
# the repository variable AUTOPILOT_ENABLED is set to "true"; manual runs work
# any time. See docs/autopilot.md for secrets and variables.

on:
  schedule:
    - cron: "23 14 * * *"
  workflow_dispatch:
    inputs:
      project:
        description: Directory under projects/
        default: data_stories
      publish:
        description: "Comma-separated platforms (local, youtube, instagram); blank uses project.yml"
        default: local
      topic:
        description: Optional topic to produce instead of the next queued one
        default: ""

permissions:
  contents: write

# Never run two publishers at once; a second run would pick the same topic.
concurrency:
  group: reel-autopilot
  cancel-in-progress: false

jobs:
  reel:
    if: github.event_name != 'schedule' || vars.AUTOPILOT_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PROJECT: ${{ inputs.project || vars.AUTOPILOT_PROJECT || 'data_stories' }}
      PUBLISH: ${{ github.event_name == 'schedule' && vars.AUTOPILOT_PUBLISH || inputs.publish }}
      TOPIC: ${{ inputs.topic }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Pango builds manimpango; lavapipe gives wgpu a software Vulkan adapter on GPU-less runners.
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libpango1.0-dev pkg-config mesa-vulkan-drivers libvulkan1 ffmpeg fonts-liberation

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-reels.txt -r requirements-ai.txt
          python -m pip install -e . --no-deps

      - name: Produce and publish
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
        run: |
          args=(--project "$PROJECT" run)
          if [ -n "$PUBLISH" ]; then args+=(--publish "$PUBLISH"); fi
          if [ -n "$TOPIC" ]; then args+=(--topic "$TOPIC"); fi
          python -m reelstudio.autopilot "${args[@]}"

      - name: Keep the reel as a workflow artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reel-${{ github.run_id }}
          path: |
            videos/${{ env.PROJECT }}/runs/*/final/final.mp4
            videos/${{ env.PROJECT }}/runs/*/final/cover.png
            videos/${{ env.PROJECT }}/runs/*/final/captions.srt
            videos/${{ env.PROJECT }}/runs/*/final/metadata.json
          if-no-files-found: ignore

      # The log and new storyboards are the autopilot's memory between runs.
      - name: Commit the publication log and new storyboards
        if: always()
        run: |
          git config user.name "reel-autopilot"
          git config user.email "reel-autopilot@users.noreply.github.com"
          git add "projects/$PROJECT/published.yml" "projects/$PROJECT/storyboards" 2>/dev/null || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "autopilot: log reel for $PROJECT"
          git push
